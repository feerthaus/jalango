# Monthly check for new Mapbox GL JS versions (owner's request): opens a PR so
# CI tests it; nothing is merged until the owner says so. Other dependencies
# are left alone to keep the noise down.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    allow:
      - dependency-name: mapbox-gl
    open-pull-requests-limit: 1
    commit-message:
      prefix: chore(deps)
    labels:
      - dependencies
      - mapbox
