name: Update speed cameras

on:
  schedule:
    - cron: '23 18 * * 0' # Mondays 02:23 Malaysia time
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-speed-cameras.mjs
      - name: Commit if changed
        run: |
          if git diff --quiet -- web/public/data/speed-cameras.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "jalango-bot"
          git config user.email "jalango-bot@users.noreply.github.com"
          git add web/public/data/speed-cameras.json
          git commit -m "Update speed cameras from OpenStreetMap"
          git pull --rebase origin main
          git push origin HEAD:main
