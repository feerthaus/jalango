# JalanGo on Netlify: static web app (web/dist) + Express API as a function.
[build]
  command = "npm run build --workspace web"
  publish = "web/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # Sentry crash reporting. A DSN only allows sending events, so it is public by design.
  VITE_SENTRY_DSN = "https://f0c8dfaefbe454fa49cf56e2a00cecae@o4512388559536128.ingest.us.sentry.io/4512388594991104"

[functions]
  node_bundler = "esbuild"

# API → function (keeps the /api/... path the app already uses)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Single-page app routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=(), payment=(), usb=()"

# Service worker and manifest must always be fresh so updates reach installed apps
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "no-cache"
    Content-Type = "application/manifest+json"

# Hashed build files never change
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
